<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌌 GARGANTUA // Cinematic Relativistic Raymarcher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <canvas id="glCanvas"></canvas>

    <main class="hud-panel">
        <header class="hud-section header">
            <h1>GARGANTUA // MODELING</h1>
            <div class="badge animate-pulse">CINEMATIC PASS ACTIVE</div>
        </header>

        <section class="hud-section controls">
            <div class="control-group">
                <label for="massSlider">SINGULARITY MASS (M)</label>
                <div class="slider-wrapper">
                    <input type="range" id="massSlider" min="0.5" max="3.5" step="0.05" value="1.9">
                    <span id="massVal" class="monochrome-val">1.9</span>
                </div>
            </div>

            <div class="control-group">
                <label for="diskSlider">DISK RADIUS (R)</label>
                <div class="slider-wrapper">
                    <input type="range" id="diskSlider" min="2.5" max="7.0" step="0.1" value="5.5">
                    <span id="diskVal" class="monochrome-val">5.5</span>
                </div>
            </div>
        </section>

        <footer class="hud-section telemetry">
            <div class="telemetry-row">
                <span>INTERACTION:</span>
                <span class="val text-orange">DOUBLE-TAP / CLICK MESH TO LOOK</span>
            </div>
            <div class="telemetry-row">
                <span>TIME PARAMETER (t):</span>
                <span id="timeReadout" class="val">0.00s</span>
            </div>
        </footer>
    </main>

    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
